name: Bug report
description: Report a reproducible problem with 3DS Chess.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Reports in English or Spanish are welcome. Remove personal details, save files, private assets and credentials before attaching excerpts or screenshots.
  - type: input
    id: version
    attributes:
      label: Game version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Console model or emulator and version
      placeholder: Old Nintendo 3DS XL or Azahar 2126.2
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Error code, sanitized log excerpt or screenshots
      description: Include only the relevant lines and remove identifying details.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
